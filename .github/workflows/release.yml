name: Build and Release

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  release-message:
    name: Check release message
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.parse.outputs.should_release }}
      release_tag: ${{ steps.parse.outputs.release_tag }}

    steps:
      - name: Parse commit message
        id: parse
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(printf '%s\n' "${COMMIT_MESSAGE}" | sed -n '1{s/^[[:space:]]*//;s/[[:space:]]*$//;p;}')
          RELEASE_TAG=$(printf '%s\n' "${FIRST_LINE}" | sed -nE 's/^(v[0-9]+\.[0-9]+\.[0-9]+)([[:space:]].*)?$/\1/p')

          if [ -n "${RELEASE_TAG}" ]; then
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          else
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          fi

  build-release:
    name: Build update site and publish release
    runs-on: ubuntu-latest
    needs: release-message
    if: needs.release-message.outputs.should_release == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Sync release version
        shell: bash
        run: |
          RELEASE_TAG="${{ needs.release-message.outputs.release_tag }}"
          bash scripts/sync-release-version.sh "${RELEASE_TAG}"

      - name: Build with Maven
        run: mvn -B clean verify

      - name: Package update site
        id: package
        shell: bash
        run: |
          RELEASE_TAG="${{ needs.release-message.outputs.release_tag }}"

          ARCHIVE_NAME="dbeaver-webdav-backup-plugin-${RELEASE_TAG}.zip"
          (cd dist && zip -r "../${ARCHIVE_NAME}" .)

          echo "archive_name=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.archive_name }}

      - name: Publish update site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          force_orphan: true
